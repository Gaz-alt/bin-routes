<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --green: #1a9c3c; --red: #d62b2b; --purple: #7c3aed; --ink: #1d2433; --muted: #5b6475; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
         display: flex; flex-direction: column; background: #fff; }
  header { padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           border-bottom: 1px solid #dde1e7; }
  header h1 { font-size: 17px; margin: 0; flex: 1 1 auto; }
  .key { font-size: 14px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
  label.file, button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 14px;
                       background: #2d5fd3; color: #fff; cursor: pointer; }
  button.secondary { background: #e7eaf0; color: var(--ink); }
  button.on { background: var(--green); color: #fff; }
  input[type=file] { display: none; }
  #map { flex: 1; min-height: 200px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 500; }
  #empty[hidden] { display: none; }
  #empty div { background: #fff; padding: 16px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.15);
               max-width: 320px; text-align: center; pointer-events: auto; }
  .arrow { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
           border-bottom: 14px solid #0d5c22; transform-origin: 50% 60%; }
  .revpin { background: var(--red); color: #fff; font-weight: 800; font-size: 13px; border-radius: 50%;
            width: 26px; height: 26px; display: grid; place-items: center; border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .trvpin { background: var(--purple); color: #fff; font-weight: 800; font-size: 12px; border-radius: 6px;
            padding: 2px 6px; white-space: nowrap; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin { font-weight: 800; font-size: 12px; color: #fff; border-radius: 6px; padding: 2px 6px;
         white-space: nowrap; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin.pause { background: #8a6d1f; }
  .pin.resume { background: #1a9c3c; }
  .sfpin { background: var(--ink); color: #fff; font-weight: 700; font-size: 12px; border-radius: 6px;
           padding: 2px 6px; white-space: nowrap; border: 2px solid #fff; }
  .wrap { position: relative; flex: 1; display: flex; min-height: 0; }
  body { overflow: hidden; }
  @media (max-height: 640px), (max-width: 420px) {   /* pop-up window / phone */
    header { padding: 4px 8px; gap: 6px; }
    header h1 { font-size: 14px; flex-basis: 100%; }
    .key { font-size: 12px; gap: 8px; }
    .sw { width: 16px; height: 5px; }
    label.file, button { padding: 6px 10px; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Round Viewer</h1>
  <span class="key"><span><span class="sw" style="background:var(--green)"></span>Collecting</span>
    <span><span class="sw" style="background:var(--red)"></span>Reverse down</span>
    <span id="trvKey" hidden><span class="sw" style="background:var(--purple)"></span>Travel to next area</span>
    <span id="gapKey" hidden><span class="sw" style="background:repeating-linear-gradient(90deg,#6b7280 0 5px,transparent 5px 9px)"></span>Not recorded</span></span>
  <label class="file">Open round…<input type="file" id="file" accept=".gpx,application/gpx+xml,.xml"></label>
  <button class="secondary" id="btnMe">Show me</button>
</header>
<div class="wrap">
  <div id="map"></div>
  <div id="empty"><div>Tap <b>Open round…</b> and choose the round's <b>.gpx</b> file.</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const map = L.map("map").setView([54.5, -2.5], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);
const lines = L.layerGroup().addTo(map);    // route lines (redrawn on zoom)
const layer = L.layerGroup().addTo(map);    // pins, gap lines
const arrows = L.layerGroup().addTo(map);
let runs = [];

function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b) {
  const r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
  const x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return Math.atan2(y, x) / r;
}

const COLOURS = ["#1a9c3c", "#d62b2b", "#7c3aed"];      // collecting, reversing, travelling
const ARROW_COLOURS = ["#0d5c22", "#7a0f0f", "#3b1a78"];

// Reads GPX from Round Recorder (tracks typed forward/reverse/travel). Any
// other GPX file shows as all collecting (green).
function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("That file isn't a readable GPX file.");
  const out = [];
  for (const trk of doc.getElementsByTagName("trk")) {
    const type = ((trk.getElementsByTagName("type")[0] || {}).textContent || "").trim().toLowerCase();
    const mode = type === "reverse" ? 1 : type === "travel" ? 2 : 0;
    for (const seg of trk.getElementsByTagName("trkseg")) {
      const pts = [...seg.getElementsByTagName("trkpt")].map(p => [+p.getAttribute("lat"), +p.getAttribute("lon")]);
      if (pts.length > 1) out.push({ mode, rev: mode === 1, travel: mode === 2, pts });
    }
  }
  const name = (doc.querySelector("metadata > name") || doc.querySelector("trk > name") || {}).textContent;
  if (!out.length) throw new Error("No route found in that file.");
  // tip-run pause / resume points
  const stops = { pause: [], resume: [] };
  for (const w of doc.getElementsByTagName("wpt")) {
    const type = ((w.getElementsByTagName("type")[0] || {}).textContent || "").trim().toLowerCase();
    if (type in stops) stops[type].push([+w.getAttribute("lat"), +w.getAttribute("lon")]);
  }
  return { name, runs: out, stops };
}

// ---------------------------------------------------------------------------
// "Reverse in, drive back out": when the section after a reverse retraces the
// same street, both are drawn side by side like two lanes (each on its own
// left), instead of one line hiding the other.
// ---------------------------------------------------------------------------
const SAME_STREET_M = 15;     // drive-out points this close to the reversed street count as the same street
const LANE_PX = 5;            // how far each lane sits from the street centre (screen pixels)
let pieces = [];              // what gets drawn: { mode, pts, lane (bool), shown }
let reverseInfo = [];         // per reverse, in order: true if they drove back out the same street

function toXY(p, lat0) {      // metres on a local flat grid, fine over a few km
  return [p[1] * 111320 * Math.cos(lat0 * Math.PI / 180), p[0] * 110540];
}
function distToPath(p, path) {
  const lat0 = p[0], q = toXY(p, lat0);
  let best = Infinity;
  for (let i = 1; i < path.length; i++) {
    const a = toXY(path[i - 1], lat0), b = toXY(path[i], lat0);
    const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / len2)) : 0;
    best = Math.min(best, Math.hypot(q[0] - a[0] - t * dx, q[1] - a[1] - t * dy));
  }
  return best;
}
const pathLen = pts => pts.reduce((s, p, i) => i ? s + dist(pts[i - 1], p) : 0, 0);

function buildPieces(runs) {
  pieces = []; reverseInfo = [];
  for (let i = 0; i < runs.length; i++) {
    const r = runs[i];
    if (!r.rev) { if (!r.used) pieces.push({ mode: r.mode, pts: r.pts, lane: false }); continue; }
    const next = runs[i + 1];
    let paired = false;
    if (next && !next.rev && dist(r.pts[r.pts.length - 1], next.pts[0]) <= 25) {
      // how far the next section runs back along the reversed street
      let k = 0;
      while (k < next.pts.length && distToPath(next.pts[k], r.pts) <= SAME_STREET_M) k++;
      const revLen = pathLen(r.pts), outLen = pathLen(next.pts.slice(0, k));
      if (revLen >= 15 && k >= 2 && outLen >= 0.6 * revLen) {
        paired = true;
        pieces.push({ mode: 1, pts: r.pts, lane: true });
        pieces.push({ mode: next.mode, pts: next.pts.slice(0, k), lane: true });
        if (k < next.pts.length) pieces.push({ mode: next.mode, pts: next.pts.slice(k - 1), lane: false });
        next.used = true;
      }
    }
    if (!paired) pieces.push({ mode: 1, pts: r.pts, lane: false });
    reverseInfo.push(paired);
  }
}

// shift a line LANE_PX to the left of its own direction of travel
function laneOf(pts) {
  const xy = pts.map(p => map.latLngToLayerPoint(p));
  return xy.map((pt, i) => {
    const a = xy[Math.max(0, i - 1)], b = xy[Math.min(xy.length - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const ll = map.layerPointToLatLng(L.point(pt.x + dy / len * LANE_PX, pt.y - dx / len * LANE_PX));
    return [ll.lat, ll.lng];
  });
}

function drawLines() {
  lines.clearLayers();
  // collecting, then travelling, then reversing on top, so a street used more than
  // one way still shows its red reverse
  for (const p of [0, 2, 1].flatMap(m => pieces.filter(p => p.mode === m))) {
    p.shown = p.lane ? laneOf(p.pts) : p.pts;
    L.polyline(p.shown, { color: "#fff", weight: p.lane ? 9 : 11, opacity: .8 }).addTo(lines);   // halo
    L.polyline(p.shown, { color: COLOURS[p.mode], weight: p.lane ? 6 : (p.mode === 1 ? 8 : 7) }).addTo(lines);
  }
}

function draw(route) {
  layer.clearLayers();
  runs = route.runs;
  buildPieces(runs);
  document.getElementById("title").textContent = route.name || "Round Viewer";
  document.getElementById("empty").hidden = true;
  let n = 0, gaps = 0, tip = 0;
  const stops = route.stops || { pause: [], resume: [] };
  const near = (list, p) => list.some(q => dist(q, p) <= 30);
  const tipPin = (p, html, cls, text) => L.marker(p, { icon: L.divIcon({ className: "", iconSize: null, iconAnchor: [0, 12],
    html: `<div class="pin ${cls}">${html}</div>` }), zIndexOffset: 950 }).bindPopup(text).addTo(layer);
  // where one section doesn't start where the last one ended, either the driver
  // paused for a tip run (pins, no line), or the recording stopped (page hidden /
  // GPS lost): show that honestly, not as a route
  for (let i = 1; i < runs.length; i++) {
    const a = runs[i - 1].pts[runs[i - 1].pts.length - 1], b = runs[i].pts[0];
    if (near(stops.pause, a) && near(stops.resume, b)) {
      tip++;
      tipPin(a, `⏸ Tip ${tip}`, "pause", `<b>Tip run ${tip}</b><br>The round pauses here for the tip. ` +
             `No route is recorded to the tip - go your usual way. Come back to <b>▶ Resume ${tip}</b>.`);
      tipPin(b, `▶ Resume ${tip}`, "resume", `<b>Resume ${tip}</b><br>Back from the tip: carry on the round from here.`);
      continue;
    }
    if (dist(a, b) > 25) {
      gaps++;
      L.polyline([a, b], { color: "#6b7280", weight: 5, dashArray: "8 10" })
        .bindPopup(`<b>Not recorded</b><br>The route between these points wasn't recorded (about ${Math.round(dist(a, b))} m). Ask the regular driver.`)
        .addTo(layer);
    }
  }
  // finished at the tip without resuming
  const endPt = runs[runs.length - 1].pts[runs[runs.length - 1].pts.length - 1];
  if (near(stops.pause, endPt) && stops.pause.length > tip)
    tipPin(endPt, `⏸ Tip ${tip + 1}`, "pause", `<b>Tip run ${tip + 1}</b><br>The round goes to the tip from here.`);
  document.getElementById("gapKey").hidden = !gaps;
  document.getElementById("trvKey").hidden = !runs.some(r => r.travel);
  let t = 0;
  for (const r of runs) {
    if (r.travel && r !== runs[0]) {          // the drive out from the depot is already marked START
      t++;
      L.marker(r.pts[0], { icon: L.divIcon({ className: "", html: `<div class="trvpin">Travel ${t}</div>`,
        iconSize: null, iconAnchor: [30, 12] }), zIndexOffset: 900 })
        .bindPopup(`<b>Travel ${t}</b><br>Area finished here. Follow the purple line to the next area (not collecting).`)
        .addTo(layer);
    }
    if (r.rev) {
      const outSame = reverseInfo[n];
      n++;
      L.marker(r.pts[0], { icon: L.divIcon({ className: "", html: `<div class="revpin">R${n}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13] }), zIndexOffset: 1000 })
        .bindPopup(`<b>Reverse ${n}</b><br>` + (outSame
          ? `Reverse <b>in</b> down this street (red), then drive back <b>out</b> forwards the same way (${r.mode === 1 && runs[runs.indexOf(r) + 1]?.travel ? "purple" : "green"}).`
          : `Reverse down this street (red line), don't drive in. Carry on from the far end of the red line.`))
        .addTo(layer);
    }
  }
  const all = runs.flatMap(r => r.pts);
  const pin = (p, t) => L.marker(p, { icon: L.divIcon({ className: "", html: `<div class="sfpin">${t}</div>`,
    iconSize: null, iconAnchor: [20, 12] }) }).addTo(layer);
  pin(all[0], "START"); pin(all[all.length - 1], "FINISH");
  map.fitBounds(L.latLngBounds(all), { padding: [30, 30], animate: false });
  drawLines();
  drawArrows();
}

// Direction arrows every ~120 px along the forward sections, redrawn on zoom
function drawArrows() {
  arrows.clearLayers();
  if (!pieces.length) return;
  const metresPerPx = 40075016 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom() + 8);
  const gap = 120 * metresPerPx;
  const view = map.getBounds().pad(0.2);
  for (const r of pieces) {
    const pts = r.shown || r.pts;
    let acc = r.lane ? gap / 4 : gap / 2;    // short lanes still get an arrow each
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], d = dist(a, b);
      if (d === 0) continue;
      while (acc <= d) {
        const f = acc / d, p = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
        if (view.contains(p)) {
          // on reversing sections the arrow shows the way the lorry travels (backwards)
          const color = ARROW_COLOURS[r.mode];
          L.marker(p, { interactive: false, icon: L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7],
            html: `<div class="arrow" style="border-bottom-color:${color};transform:rotate(${bearing(a, b)}deg)"></div>` }) })
            .addTo(arrows);
        }
        acc += gap;
      }
      acc -= d;
    }
  }
}
map.on("zoomend", () => { if (pieces.length) drawLines(); });  // lanes are a fixed pixel width apart
map.on("zoomend moveend", drawArrows);

document.getElementById("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => draw(parseGpx(t))).catch(err => alert(err.message));
};

// ?route=rounds/monday-3.gpx  -> opens that file straight away (for a shared link)
const q = new URLSearchParams(location.search).get("route");
if (q) fetch(q).then(r => { if (!r.ok) throw new Error("Couldn't load " + q); return r.text(); })
  .then(t => draw(parseGpx(t))).catch(err => alert(err.message));

// Keep the screen on while following the round with "Show me"
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock && watch !== null) {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

// Live position
let watch = null, me = null, first = true;
document.getElementById("btnMe").onclick = function () {
  if (watch !== null) {
    navigator.geolocation.clearWatch(watch); watch = null;
    if (me) { map.removeLayer(me); me = null; }
    if (wakeLock) wakeLock.release();
    this.classList.remove("on"); this.textContent = "Show me"; return;
  }
  if (!("geolocation" in navigator)) { alert("No location on this device."); return; }
  this.classList.add("on"); this.textContent = "Showing me"; first = true;
  setTimeout(keepAwake, 0);
  watch = navigator.geolocation.watchPosition(pos => {
    const p = [pos.coords.latitude, pos.coords.longitude];
    if (!me) me = L.circleMarker(p, { radius: 9, color: "#fff", weight: 3, fillColor: "#2d5fd3", fillOpacity: 1 }).addTo(map);
    me.setLatLng(p);
    if (first) { map.setView(p, Math.max(map.getZoom(), 17)); first = false; }
  }, () => alert("Location is blocked. Allow it in the browser settings."), { enableHighAccuracy: true });
};
</script>
</body>
</html>
